    <script>
      

      function show(msg, obj) {
        out.textContent = msg + (obj ? "\n\n" + JSON.stringify(obj, null, 2) : "");
      }

      window.addEventListener("error", (e) =>
        show("JS error ❌", { message: e.message })
      );
      window.addEventListener("unhandledrejection", (e) =>
        show("Promise error ❌", { reason: String(e.reason) })
      );

      const SUPABASE_URL = "https://izexxryxkqcgezdfjqlg.supabase.co";
      const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml6ZXh4cnl4a3FjZ2V6ZGZqcWxnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE2MDg3MTksImV4cCI6MjA4NzE4NDcxOX0.JFNhaVRwTpZ4LJ8_La1dbb466Trjag_irF_ny_pKYxg";

      if (!window.supabase) {
        show("Supabase library did NOT load ❌ (CDN blocked/offline?)");
      } else {
        show("Supabase library loaded ✅");

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        (async () => {
          show("Querying Supabase… ⏳");

          // 👇 CHANGE THIS to a real table name (example: "transactions")
          const { data, error } = await supabase.from("accounts").select("*").limit(5);

          else show("Success ✅ Data:", data);
        })();
      }
    </script>
