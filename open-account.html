<!DOCTYPE html>
    <html>
        <head>
            <Title>Sign Up!</Title>
            <link rel="stylesheet" href="styles.css">
            <style>
                * {
                    box-sizing: border-box;
                    
                }
                body {
                    margin: 0;
                    background-image: url("Untitled design (1).png");
                    background-size: cover;
                    background-position: center;
                    background-repeat: no-repeat;
                    min-height: 100vh;
                }
                
                
            </style>
        </head>
        <header class="site-header">
            <nav class="nav">
                <a class="brand" href="index.html">
                    <img src="Budgie (1).png" alt="Commerce Bank Home" class="logo" height="100"></a>
                <div class="nav-links">
                    <a href="about.html">About</a>
                    <a href="open-account.html">Open an Account</a>
                    <a href="login.html">Log In</a>
                    <a href="features.html">Features</a>
                    <a href="llm-help.html">AI Help</a>
                </div>
                
            </nav>
        </header>

        <body>
            <div class="register-body">
            <div class="content-box">
                <div class="register-credentials">
                    <h1>Sign Up for an Account Today!</h1>
                    <h3><i>For more information about the tool, click <a href="about.html">here</a>!</i></h3>
                    <br>
                    <label for="first-name">First Name:</label>
                    <input type="text" id="first-name" name="firstname" placeholder="Please enter first name">
                    <br>
                    <label for="last-name">Last Name:</label>
                    <input type="text" id="last-name" name="lastname" placeholder="Please enter last name">
                    <br>
                    <br>
                    <label for="email-address">Email Address:</label>
                    <input type="email" id="email-address" name="emailaddress" placeholder="Please enter email">
                    <br>
                    <label for="password-input">Password:</label>
                    <input type="password" id="password-input" name="password" placeholder="Please enter password">
                    <br>
                    <label for="reenter-password">Re-enter Password</label>
                    <input type="password" id="reenter-password" name="password-again" placeholder="Please re-enter password">
                    <p><i>Password must contain at least 8 characters, an uppercase letter, a number, and a special character.</i></p>
            
                    <br>
                    <input type="submit" id="account-submit" name="accountSubmit">
                </div>
            </div>
            </div>
        </body>
    </html>
