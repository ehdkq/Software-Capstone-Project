<!DOCTYPE html>
    <html>
        <head>
            <title>Login Page</title>
            <link rel="icon" type="image/png" href="./images/happy-budgie.png">
            <link rel="stylesheet" href="./css/styles.css">
            <script>
        if (localStorage.getItem('budgieTheme') === 'dark') {
            document.documentElement.classList.add('dark-theme');
            // Adding to body when it loads
            window.addEventListener('DOMContentLoaded', () => {
                document.body.classList.add('dark-theme');
            });
        }
    </script>
            <style>
                * {
                    box-sizing: border-box;
                }
                body {
                    margin: 0;
                    background-image: url("./images/Untitled design (1).png");
                    background-size: cover;
                    background-position: center;
                    background-repeat: no-repeat;
                    min-height: 100vh;
                }
                
            </style>
        </head>
        <div id="header-container"></div>

        <body class="login-body">
            <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

            <div class="login-credentials">
                <div class="content-box">
                    <h1>Welcome Back! Please log in below.</h1>
                    <p><i>Please log in using your credentials below.</i></p>
                    <br>
                    
                    <form id="login-form">
                        <div class="form-row">
                            <label for="email-login">Email:</label>
                            <input type="email" id="email-login" required>
                            <br><br>
                            <label for="password-login">Password:</label>
<span style="position: relative; display: inline-block;">
    <input type="password" id="password-login" required style="padding-right: 35px;">
    <span id="toggle-password" style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: 1.1rem;" title="Show Password">👁️</span>
</span>
<br><br>
                        </div>
                        <button type="submit" id="login-button" class="action-btn" style="padding: 10px 20px; cursor: pointer;">Log In</button>
                        
                    </form>
                    <p style="margin-top: 15px;">
                        <a href="#" id="show-forgot-password" style="color: #9966FF; text-decoration: none; font-size: 0.9rem;">Forgot Password?</a>
                    </p>

                    <div id="forgot-password-section" style="display: none; margin-top: 20px; padding-top: 20px; border-top: 1px solid #ccc;">
                        <h3>Reset Password</h3>
                        <p style="font-size: 0.9rem;">Enter your email and we'll send you a reset link.</p>
                        <form id="forgot-password-form">
                            <input type="email" id="reset-email" placeholder="Your account email" required style="padding: 8px; width: 100%; margin-bottom: 10px;">
                            <button type="submit" id="reset-submit-btn" class="action-btn" style="padding: 8px 15px; width: 100%;">Send Reset Link</button>
                        </form>
                    </div>
                    
                    <p id="error-message" style="color: red; margin-top: 15px;"></p>
                </div>
            </div>
        <script src="./js/login.js"></script>
        <script src="./js/global.js"></script>
        </body>
    </html>
