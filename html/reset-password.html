<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Reset Password - Budgie</title>
    <link rel="icon" type="image/png" href="./images/happy-budgie.png">
    <link rel="stylesheet" href="./css/styles.css">
    <style>
        body {
            margin: 0;
            background-image: url("./images/Untitled design (1).png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .reset-box {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
    </style>
</head>
<body>
    <div id="toast-container" class="toast-container"></div>
    
    <div class="reset-box">
        <h2>Set New Password</h2>
        <form id="new-password-form">
            <input type="password" id="new-pass" placeholder="New Password" required style="width: 100%; padding: 10px; margin-bottom: 15px;">
            <input type="password" id="confirm-pass" placeholder="Confirm Password" required style="width: 100%; padding: 10px; margin-bottom: 20px;">
            <button type="submit" id="save-password-btn" class="action-btn" style="width: 100%; padding: 10px;">Update Password</button>
        </form>
    </div>

    <script src="./js/global.js"></script>
    <script>
        document.getElementById('new-password-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // 1. Get the token out of the URL (e.g. ?token=abcdef123)
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            
            if (!token) {
                showToast("Missing reset token. Please use the link from your email.", "error");
                return;
            }

            const newPass = document.getElementById('new-pass').value;
            const confirmPass = document.getElementById('confirm-pass').value;
            const saveBtn = document.getElementById('save-password-btn');

            if (newPass !== confirmPass) {
                showToast("Passwords do not match!", "error");
                return;
            }

            saveBtn.textContent = "Updating...";
            saveBtn.disabled = true;

            try {
                const formData = new FormData();
                formData.append("token", token);
                formData.append("new_password", newPass);

                const response = await fetch('https://software-capstone-project.onrender.com/api/execute-reset', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showToast("Password updated! Redirecting to login...", "success");
                    setTimeout(() => {
                        window.location.href = "login.html";
                    }, 2000);
                } else {
                    showToast(data.error, "error");
                    saveBtn.textContent = "Update Password";
                    saveBtn.disabled = false;
                }
            } catch (err) {
                showToast("Server error. Please try again.", "error");
                saveBtn.textContent = "Update Password";
                saveBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
