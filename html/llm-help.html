<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/html/css/styles.css">
    <title>AI Help - Budgie</title>
    <style>
        .message p {
            margin-top: 0;
            margin-bottom: 10px;
        }
        .message p:last-child {
            margin-bottom: 0;
        }
        .message ul, .message ol {
            margin-top: 5px;
            margin-bottom: 10px;
            padding-left: 20px;
        }
    </style>
</head>
<body class="chat-body">
    
    <header class="site-header">
        <nav class="nav">
            <a class="brand" href="index.html">
                <img src="/html/images/Budgie (1).png" alt="Commerce Bank Home" class="logo" height="100"></a>
            <div class="nav-links">
                <a href="about.html">About</a>
                <a href="open-account.html">Open an Account</a>
                <a href="login.html">Log In</a>
                <a href="dashboard.html">Dashboard</a>
            </div>
        </nav>
    </header>

    <main class="chat-main-content">
        <div class="chat-container">
            <div class="chat-header">
                <img src="/html/images/sleepy-budgie.png" alt="Budgie" class="chat-avatar">
                <div>
                    <h3 style="margin: 0; color: #333;">Budgie AI</h3>
                    <p style="margin: 0; font-size: 0.8rem; color: #666;">Online</p>
                </div>
            </div>

            <div class="chat-messages" id="chat-messages">
                <div class="message-wrapper ai-wrapper">
                    <div class="message ai-message">
                        Hello! I'm Budgie. I can help you understand your spending or give you budgeting tips. What's on your mind?
                    </div>
                </div>
            </div>

            <form class="chat-input-area" id="chat-form">
                <input type="text" id="chat-input" placeholder="Ask about your budget..." autocomplete="off" required>
                <button type="submit" class="send-btn">Send</button>
            </form>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-content">
            <a href="index.html" class="footer-brand">
                <img src="/html/images/sleepy-budgie.png" alt="Sleepy Budgie" class="logo" height="100"></a>
            <div class="footer-links">
                <a href="about.html">About</a>
                <a href="features.html">Features</a>
                <a href="login.html">Login</a>
                <a href="open-account.html">Sign Up</a>
                <a href="developers.html">Developers</a>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        const chatForm = document.getElementById('chat-form');
        const chatInput = document.getElementById('chat-input');
        const chatMessages = document.getElementById('chat-messages');

        // Helper function to append messages to the screen
        function appendMessage(text, sender) {
            const wrapper = document.createElement('div');
            wrapper.classList.add('message-wrapper');
            wrapper.classList.add(sender === 'user' ? 'user-wrapper' : 'ai-wrapper');

            const bubble = document.createElement('div');
            bubble.classList.add('message');
            bubble.classList.add(sender === 'user' ? 'user-message' : 'ai-message');
            
            // If it has text right away, format it. Otherwise, leave it blank (for the typing effect).
            if (text) {
                if (sender === 'ai') {
                    bubble.innerHTML = marked.parse(text);
                } else {
                    bubble.textContent = text;
                }
            }

            wrapper.appendChild(bubble);
            chatMessages.appendChild(wrapper);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            
            return { wrapper, bubble }; // Return both so we can target the bubble directly
        }

        // --- THE NEW TYPING EFFECT FUNCTION ---
        function typeOutMessage(element, fullText) {
            let i = 0;
            let currentText = "";
            const typingSpeed = 15; // Milliseconds per character. Lower = faster!

            const interval = setInterval(() => {
                // Add one character at a time
                currentText += fullText.charAt(i);
                
                // Parse the growing text into Markdown HTML
                element.innerHTML = marked.parse(currentText);
                
                // Auto-scroll down as the text grows
                chatMessages.scrollTop = chatMessages.scrollHeight;
                
                i++;
                // Stop the timer when we run out of text
                if (i >= fullText.length) {
                    clearInterval(interval);
                }
            }, typingSpeed);
        }

        chatForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const messageText = chatInput.value.trim();
            if (!messageText) return;
            
            // 1. Show user message instantly
            appendMessage(messageText, 'user');
            chatInput.value = '';

            // 2. Show temporary "thinking..." indicator
            const thinkingElements = appendMessage("Budgie is thinking...", 'ai');
            thinkingElements.bubble.style.fontStyle = "italic";
            thinkingElements.bubble.style.opacity = "0.6";

            try {
                // 3. Send message to Python
                const response = await fetch("http://127.0.0.1:8000/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: messageText })
                });

                // 4. Remove the "thinking" indicator
                thinkingElements.wrapper.remove();

                if (response.ok) {
                    const data = await response.json();
                    
                    // 5. Create an empty bubble, then trigger the typing effect!
                    const aiElements = appendMessage("", 'ai');
                    typeOutMessage(aiElements.bubble, data.reply);
                    
                } else {
                    appendMessage("Oops! I'm having trouble connecting to my brain right now.", 'ai');
                }
            } catch (error) {
                console.error("Chat Error:", error);
                thinkingElements.wrapper.remove();
                appendMessage("Error: Could not reach the Python server. Make sure it's running!", 'ai');
            }
        });
    </script>
</body>
</html>
