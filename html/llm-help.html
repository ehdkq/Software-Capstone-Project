<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Help - Budgie</title>
    <link rel="stylesheet" href="./css/styles.css">
    <script>
        if (localStorage.getItem('budgieTheme') === 'dark') {
            document.documentElement.classList.add('dark-theme');
            // Adding to body when it loads
            window.addEventListener('DOMContentLoaded', () => {
                document.body.classList.add('dark-theme');
            });
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* Invisible layout logic to keep the footer at the bottom */
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
        }
        main {
            flex: 1; 
        }
        /* Makes the markdown text fit perfectly in the chat bubbles */
        .message p {
            margin-top: 0;
            margin-bottom: 10px;
        }
        .message p:last-child {
            margin-bottom: 0;
        }
        .message ul, .message ol {
            margin-top: 5px;
            margin-bottom: 10px;
            padding-left: 20px;
        }
        /* Guest badge styling */
        .guest-badge {
            font-size: 0.75rem;
            background: #ffcc00;
            color: #333;
            padding: 2px 6px;
            border-radius: 8px;
            margin-left: 8px;
            font-weight: bold;
        }
    </style>
</head>
<body class="chat-body">

    <div id="header-container"></div>

    <main class="chat-main-content">
        <div class="chat-container" id="chat-wrapper">
            <div class="chat-header">
                <img src="./images/sleepy-budgie.png" alt="Budgie Avatar" class="chat-avatar">
                <div>
                    <h3 style="margin: 0; color: #333; display: flex; align-items: center;">
                        Budgie AI <span id="status-badge"></span>
                    </h3>
                    <p style="margin: 0; font-size: 0.8rem; color: #666;">Online</p>
                </div>
            </div>
            
            <div class="chat-messages" id="chat-messages">
                </div>

            <div style="display: flex; flex-direction: column; background: var(--card-bg); border-top: 1px solid var(--border-color);">
                
                <div id="attachment-preview" class="attachment-preview">
                    <div class="attachment-pill">
                        📎 <span id="attachment-name" style="margin-left: 5px; margin-right: 5px;">filename.pdf</span>
                        <button id="remove-file-btn" class="remove-file-btn" title="Remove File">✕</button>
                    </div>
                </div>

                <div class="chat-input-area" style="border-top: none;">
                    <input type="file" id="chat-image-upload" accept="image/*, application/pdf" style="display: none;">
                    <button type="button" id="chat-upload-btn" class="upload-btn" title="Attach Receipt or Statement">📎</button>
                    
                    <input type="text" id="chat-input" placeholder="Type your message to Budgie...">
                    <button class="send-btn" id="chat-send-btn">Send</button>
                </div>
            </div>

            <div id="members-popup" class="members-only-popup">
                Hey! File analysis is for logged-in members only. 🔒
            </div>

            <div id="members-popup" class="members-only-popup">
                Hey! Image analysis is for logged-in members only. 🔒
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-content">
            <a href="index.html" class="footer-brand">
                <img src="./images/sleepy-budgie.png" alt="Sleepy Budgie" class="logo" height="100">
            </a>
            <div class="footer-links">
                <a href="about.html">About</a>
                <a href="features.html">Features</a>
                <a href="login.html">Login</a>
                <a href="open-account.html">Sign Up</a>
                <a href="developers.html">Developers</a>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <script>
        // --- 1. Security & Status Check ---
        const isLoggedIn = localStorage.getItem("isLoggedIn");
        const currentUserId = localStorage.getItem("userId");
        const chatMessages = document.getElementById('chat-messages');
        const statusBadge = document.getElementById('status-badge');

        // Dynamic Greeting based on whether they are logged in or a guest
        let initialGreeting = "";
        let finalUserId = null;

        if (isLoggedIn === "true" && currentUserId) {
            initialGreeting = "Welcome back! I've got your live account data pulled up. Do you want to review your balance, goals, or recent spending?";
            finalUserId = currentUserId; // Send real ID
        } else {
            initialGreeting = "Hello! I'm Budgie. I can give you general financial advice right now! *(If you want me to crunch the numbers on your actual budget, just log in!)*";
            statusBadge.innerHTML = '<span class="guest-badge">Guest Mode</span>';
            finalUserId = null; // Send null so Python knows it's a guest
        }

        // Put the greeting on the screen
        chatMessages.innerHTML = `
            <div class="message-wrapper ai-wrapper">
                <div class="message ai-message">${marked.parse(initialGreeting)}</div>
            </div>
        `;

        // --- 2. Chat Logic ---
        const chatForm = document.getElementById('chat-form');
        const chatInput = document.getElementById('chat-input');

        function appendMessage(text, sender) {
            const wrapper = document.createElement('div');
            wrapper.classList.add('message-wrapper');
            wrapper.classList.add(sender === 'user' ? 'user-wrapper' : 'ai-wrapper');

            const bubble = document.createElement('div');
            bubble.classList.add('message');
            bubble.classList.add(sender === 'user' ? 'user-message' : 'ai-message');
            
            if (text) {
                if (sender === 'ai') {
                    bubble.innerHTML = marked.parse(text);
                } else {
                    bubble.textContent = text;
                }
            }

            wrapper.appendChild(bubble);
            chatMessages.appendChild(wrapper);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            
            return { wrapper, bubble }; 
        }

        function typeOutMessage(element, fullText) {
            let i = 0;
            let currentText = "";
            const typingSpeed = 15;

            const interval = setInterval(() => {
                currentText += fullText.charAt(i);
                element.innerHTML = marked.parse(currentText);
                chatMessages.scrollTop = chatMessages.scrollHeight;
                
                i++;
                if (i >= fullText.length) {
                    clearInterval(interval);
                }
            }, typingSpeed);
        }

        chatForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const messageText = chatInput.value.trim();
            if (!messageText) return;
            
            appendMessage(messageText, 'user');
            chatInput.value = '';

            const thinkingElements = appendMessage("Budgie is thinking...", 'ai');
            thinkingElements.bubble.style.fontStyle = "italic";
            thinkingElements.bubble.style.opacity = "0.6";

            try {
                const response = await fetch("http://127.0.0.1:8000/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ 
                        message: messageText,
                        user_id: finalUserId // Will be the actual ID or null!
                    })
                });

                thinkingElements.wrapper.remove();

                if (response.ok) {
                    const data = await response.json();
                    const aiElements = appendMessage("", 'ai');
                    typeOutMessage(aiElements.bubble, data.reply);
                } else {
                    appendMessage("Oops! I'm having trouble connecting to my brain right now.", 'ai');
                }
            } catch (error) {
                console.error("Chat Error:", error);
                thinkingElements.wrapper.remove();
                appendMessage("Error: Could not reach the Python server. Make sure it's running!", 'ai');
            }
        });
    </script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const isLoggedIn = localStorage.getItem("isLoggedIn") === "true";
            
            // UI Elements
            const uploadBtn = document.getElementById('chat-upload-btn');
            const fileInput = document.getElementById('chat-image-upload');
            const popup = document.getElementById('members-popup');
            const chatInput = document.getElementById('chat-input');
            const sendBtn = document.getElementById('chat-send-btn');
            const chatMessages = document.querySelector('.chat-messages');
            
            // New File Preview Elements
            const previewContainer = document.getElementById('attachment-preview');
            const attachmentName = document.getElementById('attachment-name');
            const removeFileBtn = document.getElementById('remove-file-btn');
            
            let popupTimer;
            let currentAttachedFile = null;

            if (!isLoggedIn) uploadBtn.classList.add('disabled');

            // --- ATTACHMENT UI LOGIC ---
            uploadBtn.addEventListener('click', (e) => {
                e.preventDefault();
                if (!isLoggedIn) {
                    popup.classList.add('show');
                    clearTimeout(popupTimer);
                    popupTimer = setTimeout(() => popup.classList.remove('show'), 3000);
                } else {
                    fileInput.click();
                }
            });

            fileInput.addEventListener('change', (e) => {
                if (e.target.files && e.target.files[0]) {
                    currentAttachedFile = e.target.files[0];
                    
                    // Show the bubble with the file name
                    attachmentName.textContent = currentAttachedFile.name;
                    previewContainer.style.display = 'block';
                }
            });

            // Handle the 'X' button to remove the file
            removeFileBtn.addEventListener('click', () => {
                currentAttachedFile = null;
                fileInput.value = '';
                previewContainer.style.display = 'none';
            });

            // --- SEND MESSAGE LOGIC ---
            sendBtn.addEventListener('click', async () => {
                const messageText = chatInput.value.trim();
                if (!messageText && !currentAttachedFile) return;

                // 1. Display User Message in UI
                let displayMsg = messageText;
                if (currentAttachedFile) {
                    displayMsg += `<br><br><span style="font-size: 0.8rem; background: rgba(255,255,255,0.2); padding: 4px 8px; border-radius: 8px;">📎 Attached: ${currentAttachedFile.name}</span>`;
                }
                appendMessage(displayMsg, 'user');
                
                // 2. Prepare the Data
                const formData = new FormData();
                formData.append("message", messageText);
                if (currentAttachedFile) {
                    formData.append("file", currentAttachedFile);
                }

                // 3. Clear UI immediately
                chatInput.value = '';
                currentAttachedFile = null;
                fileInput.value = '';
                previewContainer.style.display = 'none';

                // 4. Send to Python Backend
                try {
                    const loadingId = appendMessage("Thinking...", 'ai');
                    
                    const response = await fetch("http://127.0.0.1:8000/api/chat", {
                        method: "POST",
                        body: formData
                    });
                    
                    const data = await response.json();
                    
                    // Remove the "Thinking..." bubble
                    document.getElementById(loadingId).remove();
                    
                    // --- THE TYPEWRITER EFFECT & MARKDOWN FIX ---
                    const fullResponse = data.reply;
                    let currentText = "";
                    let charIndex = 0;
                    
                    // Create an empty AI message bubble
                    const msgId = appendMessage("", 'ai'); 
                    const msgElement = document.querySelector(`#${msgId} .message`);

                    // Start typing it out!
                    const typingSpeed = 15; // Milliseconds per character (lower is faster)
                    
                    const typeInterval = setInterval(() => {
                        // Add one character at a time
                        currentText += fullResponse.charAt(charIndex);
                        
                        // Parse the raw text into styled HTML (bolding, lists, etc.)
                        // DOMPurify or marked options can be used here in production, but marked.parse is great for now!
                        msgElement.innerHTML = marked.parse(currentText);
                        
                        // Keep scrolling to the bottom as it types
                        chatMessages.scrollTop = chatMessages.scrollHeight;
                        
                        charIndex++;
                        
                        // Stop the timer when we run out of text
                        if (charIndex >= fullResponse.length) {
                            clearInterval(typeInterval);
                        }
                    }, typingSpeed);
                    
                } catch (error) {
                    console.error("Chat Error:", error);
                    appendMessage("Sorry, my server is currently offline.", 'ai');
                }
            });

            function appendMessage(htmlContent, sender) {
                const msgId = 'msg-' + Date.now();
                const wrapper = document.createElement('div');
                wrapper.className = `message-wrapper ${sender}-wrapper`;
                wrapper.id = msgId;
                
                wrapper.innerHTML = `
                    <div class="message ${sender}-message">
                        ${htmlContent}
                    </div>
                `;
                chatMessages.appendChild(wrapper);
                chatMessages.scrollTop = chatMessages.scrollHeight;
                return msgId;
            }
        });
    </script>
    <script src="./js/global.js"></script>
</body>
</html>
